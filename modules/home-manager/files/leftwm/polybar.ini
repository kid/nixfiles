[module/ewmh]
type = internal/xworkspaces

enable-scroll = false

label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${xrdb:color6}

label-empty = %name%
label-empty-padding = 1

label-urgent = %name
label-urgent-padding = 1

label-active = %name%
label-active-foreground = ${xrdb:color0}
label-active-background = ${xrdb:color14}
label-active-padding = 1

[module/date]
type = internal/date
date = %Y-%m-%d%
time = %H:%M:%S

label = %date% %time%
label-foreground = ${xrdb:color7}

[module/battery]
type = internal/battery

format-discharging = <ramp-capacity>
format-charging = <ramp-capacity>

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

ramp-capacity-1-foreground = #fb4934
ramp-capacity-2-foreground = #fe8019
ramp-capacity-3-foreground = #fabd2f
ramp-capacity-4-foreground = #b8bb26

[module/tags]
type = custom/script
exec = leftwm state -w $WORKSPACE -t $SCRIPTPATH/template.liquid
tail = true

[bar/base]
wm-restack = generic
modules-left = tags
modules-right = date

module-margin = 1
padding-right = 1

background = ${xrdb:color0}
foreground = ${xrdb:color15}
font-0 = "FiraCode Nerd Font:size=11;3"

[bar/nixos0]
inherit = bar/base
monitor = ${env:MONITOR}
tray-position = right

[bar/nixos1]
inherit = bar/base
monitor = ${env:MONITOR}
