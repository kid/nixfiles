name: Renovate nixfiles-work
# Every merge to main moves the nixfiles rev that kid/nixfiles-work pins in
# modules/den.nix, so ask the in-cluster renovate-operator (kid/home-ops) to
# open/update that PR now instead of at its next 3-hourly run.
on:
  push:
    branches: [main]
permissions: {}
jobs:
  dispatch:
    name: Request Renovate run on kid/nixfiles-work
    runs-on: ubuntu-latest
    steps:
      # RENOVATE_WEBHOOK_TOKEN comes from kid/home-ops' renovate-webhook
      # Terragrunt stack.
      - name: Schedule Renovate
        env:
          TOKEN: ${{ secrets.RENOVATE_WEBHOOK_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $TOKEN" \
            "https://renovate-webhook.kidibox.net/webhook/v1/schedule?namespace=renovate&job=renovate&project=kid%2Fnixfiles-work"
