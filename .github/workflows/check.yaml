name: nix flake check
on:
  push:
    paths:
      - "**.nix"
      - "**.lock"
      # Every required check must run for a PR to merge: a PR touching only
      # .github would otherwise wait on checks that never start.
      - ".github/**"
permissions: {}
jobs:
  check-flake:
    name: nixfiles (x86_64-linux)
    # The in-cluster runner (kid/home-ops' actions-runner-controller): Nix is
    # its node's daemon, whose store stays warm between runs. Push-only, so a
    # fork never runs here.
    runs-on: nixfiles
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          submodules: recursive
      - name: Configure Nix
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}" >> ~/.config/nix/nix.conf
      - name: Check Flake
        run: nix flake check
      # The daemon doesn't trust the runner with a post-build hook, so
      # cachix-action can't push as it builds: push the checks' outputs.
      - name: Push to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          checks=$(nix eval --raw .#checks.x86_64-linux --apply 'cs: toString (map (n: ".#checks.x86_64-linux.${n}") (builtins.attrNames cs))')
          nix build --no-link --print-out-paths $checks | nix run nixpkgs#cachix -- push kidibox
  build-hosts:
    name: nixos hosts (x86_64-linux)
    # After the checks: both run on the one nixfiles runner anyway.
    needs: check-flake
    runs-on: nixfiles
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          submodules: recursive
      # The hosts' own caches: the daemon lets the runner use those listed in
      # its trusted-substituters (kid/home-ops' k3s-prd-0), else they'd build.
      - name: Configure Nix
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}" >> ~/.config/nix/nix.conf
          hosts=$(nix eval --raw .#nixosConfigurations --apply 'cs: toString (builtins.filter (n: cs.${n}.pkgs.stdenv.hostPlatform.system == "x86_64-linux") (builtins.attrNames cs))')
          echo "hosts=$hosts" >> "$GITHUB_ENV"
          subs=$(for h in $hosts; do
            nix eval --raw ".#nixosConfigurations.$h.config.nix.settings" --apply 's: toString ((s.substituters or [ ]) ++ (s.extra-substituters or [ ]))'
            echo
          done | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "extra-substituters = $subs" >> ~/.config/nix/nix.conf
      - name: Build hosts
        run: |
          nix build --no-link --print-out-paths \
            $(for h in $hosts; do echo ".#nixosConfigurations.$h.config.system.build.toplevel"; done) \
            > "$RUNNER_TEMP/built"
      # So the hosts substitute what CI built instead of building it.
      - name: Push to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run nixpkgs#cachix -- push kidibox < "$RUNNER_TEMP/built"
