modkey = "Mod4"
mousekey = "Mod4"
workspaces = [
  { id = 0, x = 0, y = 480, width = 3840, height = 1600, layouts = ["LeftMain", "CenterMain", "CenterMainBalanced", "EvenHorizontal"] },
  { id = 1, x = 3840, y = 0, width = 1440, height = 2560, layouts = ["EvenVertical", "MainAndHorizontalStack"] },
]
tags = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
layouts = []
# layouts = ["MainAndVertStack", "MainAndHorizontalStack", "MainAndDeck", "GridHorizontal", "EvenHorizontal", "EvenVertical", "Fibonacci", "CenterMain", "CenterMainBalanced", "LeftMain", "Monocle", "RightWiderLeftStack", "LeftWiderRightStack"]
layout_mode = "Workspace"
scratchpad = []
disable_current_tag_swap = false
focus_behaviour = "Sloppy"
focus_new_windows = true
insert_behavior = "AfterCurrent"

keybind = [
  { modifier = ["modkey"], key = "t", command = "Execute", value = "kitty" },
  { modifier = ["modkey"], key = "p", command = "Execute", value = "rofi -show" },
  { modifier = ["modkey"], key = "b", command = "Execute", value = "google-chrome-beta" },
  { modifier = ["modkey", "Shift"], key = "b", command = "Execute", value = "google-chrome-beta --incognito" },

  { modifier = ["modkey", "Shift"], key = "w", command = "CloseWindow" },

  { modifier = ["modkey", "Shift"], key = "r", command = "SoftReload" },
  { modifier = ["modkey", "Control", "Shift"], key = "r", command = "HardReload" },
  { modifier = ["modkey", "Shift"], key = "x", command = "Execute", value = "loginctl kill-session $XDG_SESSION_ID" },

  { modifier = ["modkey"], key = "l", command = "FocusWorkspaceNext" },
  { modifier = ["modkey"], key = "h", command = "FocusWorkspacePrevious" },
  { modifier = ["modkey"], key = "k", command = "FocusWindowUp" },
  { modifier = ["modkey"], key = "j", command = "FocusWindowDown" },
  { modifier = ["modkey"], key = "m", command = "FocusWindowTop", value = "true" },

  { modifier = ["modkey", "Shift"], key = "l", command = "MoveWindowToNextWorkspace" },
  { modifier = ["modkey", "Shift"], key = "h", command = "MoveWindowToPreviousWorkspace" },
  { modifier = ["modkey", "Shift"], key = "k", command = "MoveWindowUp" },
  { modifier = ["modkey", "Shift"], key = "j", command = "MoveWindowDown" },
  { modifier = ["modkey", "Shift"], key = "m", command = "MoveWindowTop", value = "true" },

  { modifier = ["modkey"], key = "Return", command = "ToggleFullScreen" },
  { modifier = ["modkey"], key = "slash", command = "RotateTag" },
  { modifier = ["modkey"], key = "backslash", command = "NextLayout" },
  { modifier = ["modkey", "Shift"], key = "backslash", command = "PreviousLayout" },
  { modifier = ["modkey"], key = "equal", command = "IncreaseMainWidth", value = "4" },
  { modifier = ["modkey"], key = "minus", command = "DecreaseMainWidth", value = "4" },

  { modifier = ["modkey"], key = "1", command = "GotoTag", value = "1" },
  { modifier = ["modkey"], key = "2", command = "GotoTag", value = "2" },
  { modifier = ["modkey"], key = "3", command = "GotoTag", value = "3" },
  { modifier = ["modkey"], key = "4", command = "GotoTag", value = "4" },
  { modifier = ["modkey"], key = "5", command = "GotoTag", value = "5" },
  { modifier = ["modkey"], key = "6", command = "GotoTag", value = "6" },
  { modifier = ["modkey"], key = "7", command = "GotoTag", value = "7" },
  { modifier = ["modkey"], key = "8", command = "GotoTag", value = "8" },
  { modifier = ["modkey"], key = "9", command = "GotoTag", value = "9" },

  { modifier = ["modkey", "Shift"], key = "1", command = "MoveToTag", value = "1" },
  { modifier = ["modkey", "Shift"], key = "2", command = "MoveToTag", value = "2" },
  { modifier = ["modkey", "Shift"], key = "3", command = "MoveToTag", value = "3" },
  { modifier = ["modkey", "Shift"], key = "4", command = "MoveToTag", value = "4" },
  { modifier = ["modkey", "Shift"], key = "5", command = "MoveToTag", value = "5" },
  { modifier = ["modkey", "Shift"], key = "6", command = "MoveToTag", value = "6" },
  { modifier = ["modkey", "Shift"], key = "7", command = "MoveToTag", value = "7" },
  { modifier = ["modkey", "Shift"], key = "8", command = "MoveToTag", value = "8" },
  { modifier = ["modkey", "Shift"], key = "9", command = "MoveToTag", value = "9" },
]

